[project]
name = "arc-ai-analyst"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12.13"
dependencies = [
    "beautifulsoup4>=4.14.3",
    "celery>=5.6.3",
    "celery-types>=0.26.0",
    "fastapi>=0.135.3",
    "google-genai>=1.70.0",
    "pika>=1.3.2",
    "playwright>=1.58.0",
    "pypdf>=6.9.2",
    "uvicorn>=0.44.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "testcontainers>=4.14.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-v"
