name: Pull Request Checks

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
      - dev

jobs:
  test:
    name: pytest
    runs-on: ubuntu-26.04

    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Set up Python
        working-directory: ./app
        run: uv sync --frozen

      - name: Run tests
        working-directory: ./app
        run: uv run pytest

  build:
    name: Docker build test
    runs-on: ubuntu-26.04

    steps:
      - uses: actions/checkout@v6

      - name: Build Docker images
        run: IMAGE_NAME=ghcr.io/${{ github.repository }} IMAGE_TAG=pr-${{ github.event.pull_request.number }} ./scripts/build.sh