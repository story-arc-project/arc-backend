name: Pull Request Checks

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main

jobs:
  test:
    name: pytest
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Set up Python
        working-directory: ./app
        run: uv sync --frozen

      - name: Run tests
        working-directory: ./app
        run: uv run pytest