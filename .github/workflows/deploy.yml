name: Deploy

on:
  push:
    branches:
      - main
      - feature/docker-optimize

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}
  WORKDIR: ~/arc-backend

jobs:
  build:
    runs-on: ubuntu-26.04
    strategy:
      matrix:
        service: [app, ai_analyst]
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v6

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push (${{ matrix.service }})
        uses: docker/build-push-action@v7
        with:
          context: ./${{ matrix.service }}
          push: true
          tags: ${{ env.IMAGE_NAME }}/${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  deploy:
    runs-on: ubuntu-26.04
    needs: build
    permissions:
      contents: read
      packages: read

    steps:
      - uses: actions/checkout@v6

      - name: Setup SSH Key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Configure Known Hosts
        env:
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KNOWN_HOSTS" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Sync Files
        env:
          SSH: ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}
        run: |
          rsync -az --delete \
            --rsync-path="mkdir -p ${WORKDIR} && rsync" \
            docker init nginx Makefile \
            "${SSH}:${WORKDIR}/"

      - name: Log in to GHCR on Remote Server
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USERNAME: ${{ github.repository_owner }}
          SSH: ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}
        run: |
          set -euo pipefail
          printf '%s' "$GHCR_TOKEN" |
            ssh "$SSH" \
              "docker login ghcr.io -u '$GHCR_USERNAME' --password-stdin"

      - name: Deploy on Remote Server
        env:
          ENV_FILE_CONTENT: ${{ secrets.ENV_FILE }}
          IMAGE_TAG: ${{ github.sha }}
          SSH: ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}
        run: |
          printf '%s\n' "$ENV_FILE_CONTENT" | ssh "$SSH" "set -euo pipefail
            cd ${WORKDIR}
            rm -f .env .env.tmp
            umask 077
            cat > .env.tmp
            mv .env.tmp .env
            IMAGE_NAME='$IMAGE_NAME' IMAGE_TAG='$IMAGE_TAG' make deploy-prod"

      - name: Cleanup
        if: always()
        env:
          SSH: ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}
        run: |
          ssh "$SSH" "set -euo pipefail
            cd ${WORKDIR}
            rm -f .env.tmp
            docker logout ghcr.io >/dev/null 2>&1 || true"