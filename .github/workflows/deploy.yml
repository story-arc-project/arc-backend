name: Deploy

on:
  push:
    branches:
      - main
      - feature/**

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-26.04
    strategy:
      matrix:
        service: [app, ai_analyst]
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v6

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push (${{ matrix.service }})
        uses: docker/build-push-action@v7
        with:
          context: ./${{ matrix.service }}
          push: true
          tags: ${{ env.IMAGE_NAME }}/${{ matrix.service }}:${{ github.sha }}

  deploy:
    runs-on: ubuntu-26.04
    needs: build
    permissions:
      contents: read
      packages: read

    steps:
      - uses: actions/checkout@v6

      - name: Log in to GHCR on Runner
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup SSH Key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Create local .env from GitHub Secret
        run: |
          cat << 'EOF' > .env
          ${{ secrets.ENV_FILE }}
          EOF

      - name: Add SSH Host to Known Hosts
        run: ssh-keyscan -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts

      - name: Copy Nginx Directory to Remote
        run: |
          rsync -avz --mkpath --delete \
            "$GITHUB_WORKSPACE/nginx/" \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:$GITHUB_WORKSPACE/nginx/"

      - name: Deploy via Remote Docker Daemon
        env:
          DOCKER_HOST: ssh://${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          make deploy-prod